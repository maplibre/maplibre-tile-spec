name: mlt-setup-rust
description: Setup Rust requirements

inputs:
  toolchain:
    description: 'Rust toolchain to install: stable (default), nightly, or msrv'
    required: false
    default: 'stable'
  coverage:
    description: >-
      Instrument the job with cargo-llvm-cov, so every later step records coverage.
      Collect it with `just rust::coverage-report <suite>` and the mlt-upload-coverage action.
    required: false
    default: 'false'
  fuzz:
    description: Also cache the target dir of the cargo-fuzz workspace in rust/mlt-core/fuzz.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:

    - uses: taiki-e/install-action@v2
      with: { tool: 'just,cargo-binstall,cargo-hack,cargo-nextest,cargo-insta,cargo-sort' }

    # install-action has no manifest for fd, and binstall's guess at its release archive
    # misses, so it falls back to QuickInstall; name the release asset instead.
    - name: Install fd from its GitHub release
      shell: bash
      run: >-
        cargo binstall --no-confirm --no-track --disable-telemetry --strategies crate-meta-data fd-find
        --pkg-url '{ repo }/releases/download/v{ version }/fd-v{ version }-{ target }{ archive-suffix }'
        --bin-dir 'fd-v{ version }-{ target }/{ bin }{ binary-ext }'

    # Install the requested toolchain (stable, nightly, or msrv)
    - if: ${{ inputs.toolchain == 'stable' }}
      name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - if: ${{ inputs.toolchain == 'nightly' }}
      name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
    - if: ${{ inputs.toolchain == 'msrv' }}
      name: Read MSRV
      id: msrv
      shell: bash
      run: echo "value=$(just rust::get-msrv)" >> $GITHUB_OUTPUT
    - if: ${{ inputs.toolchain == 'msrv' }}
      name: Install Rust MSRV ${{ steps.msrv.outputs.value }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.msrv.outputs.value }}

    # Debug info roughly doubles the cached target dir. Set before rust-cache, which hashes CARGO_*.
    - name: Build without debug info
      shell: bash
      run: echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"

    - name: Cache Cargo registry and build artifacts
      if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          rust
          ${{ inputs.fuzz == 'true' && 'rust/mlt-core/fuzz' || '' }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        # Caching ~/.cargo/bin breaks rustup proxies after restore (they end up
        # dispatching to rustup-init mode), causing maturin-action to fail with
        # "unexpected argument '--print' found / Usage: rustup-init[EXE]".
        cache-bin: false
        # No shared-key: it drops this key and the job id, so all jobs would share one entry.
        # Each job builds different artifacts.
        key: ${{ inputs.coverage == 'true' && 'coverage' || '' }}

    - if: ${{ inputs.coverage == 'true' }}
      uses: taiki-e/install-action@v2
      with: { tool: 'cargo-llvm-cov' }
    - if: ${{ inputs.coverage == 'true' }}
      name: Instrument this job with cargo-llvm-cov
      shell: bash
      run: just -v rust::coverage-env "$GITHUB_ENV"

name: mlt-setup-rust
description: Setup Rust requirements

inputs:
  toolchain:
    description: 'Rust toolchain to install: stable (default), nightly, or msrv'
    required: false
    default: 'stable'
  coverage:
    description: >-
      Instrument the job with cargo-llvm-cov, so every later step records coverage.
      Collect it with `just rust::coverage-report <suite>` and the mlt-upload-coverage action.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:

    - uses: taiki-e/install-action@v2
      with: { tool: 'just,cargo-binstall,cargo-hack,fd-find,cargo-insta,cargo-sort,git-delta' }

    # Install the requested toolchain (stable, nightly, or msrv)
    - if: ${{ inputs.toolchain == 'stable' }}
      name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - if: ${{ inputs.toolchain == 'nightly' }}
      name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
    - if: ${{ inputs.toolchain == 'msrv' }}
      name: Read MSRV
      id: msrv
      shell: bash
      run: echo "value=$(just rust::get-msrv)" >> $GITHUB_OUTPUT
    - if: ${{ inputs.toolchain == 'msrv' }}
      name: Install Rust MSRV ${{ steps.msrv.outputs.value }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.msrv.outputs.value }}

    - name: Cache Cargo registry and build artifacts
      if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
        shared-key: mlt
        save-if: ${{ github.ref == 'refs/heads/main' }}
        # Caching ~/.cargo/bin breaks rustup proxies after restore (they end up
        # dispatching to rustup-init mode), causing maturin-action to fail with
        # "unexpected argument '--print' found / Usage: rustup-init[EXE]".
        cache-bin: false
        # Instrumented artifacts cannot be reused by the uninstrumented jobs, so they get their own cache
        key: ${{ inputs.coverage == 'true' && 'coverage' || '' }}

    - if: ${{ inputs.coverage == 'true' }}
      uses: taiki-e/install-action@v2
      with: { tool: 'cargo-llvm-cov' }
    - if: ${{ inputs.coverage == 'true' }}
      name: Instrument this job with cargo-llvm-cov
      shell: bash
      run: just -v rust::coverage-env "$GITHUB_ENV"

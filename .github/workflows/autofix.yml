name: autofix.ci # See https://autofix.ci/security why this name

# `Autofix` is a required check: a pull request merges only once its last commit needs no fixes, and a run that
# cannot push its fixes or hangs blocks it. The `bless` job is in bless.yml, so that labeling a pull request does not
# add a skipped `Autofix` check, which would count as passing.
on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions: { }

concurrency:
  group: ${{ github.workflow }}-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A single job so that one pull request costs one concurrency slot instead of five.
  # Each fixup is gated on the paths it actually reads, and one autofix-ci call commits the result.
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    # Successful runs take up to ~8.5 min; a hung hook would otherwise run until GitHub's 6h limit
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - '.github/workflows/autofix.yml'
              - 'ts/**'
              - 'inspector/**'
            rust:
              - '.github/workflows/autofix.yml'
              - 'rust/**'
            ffi:
              - '.github/workflows/autofix.yml'
              - 'rust/mlt-ffi/**'
            py:
              - '.github/workflows/autofix.yml'
              - 'rust/mlt-py/**'
            wasm:
              - '.github/workflows/autofix.yml'
              - 'rust/mlt-wasm/**'
            hexdumps:
              - '.github/workflows/autofix.yml'
              - 'docs/snippets/**'
              - 'test/synthetic/**'
              - 'rust/mlt/**'
              - 'rust/mlt-core/**'
            expected:
              - '.github/workflows/autofix.yml'
              - 'inspector/mod.just'
              - 'test/fixtures/**'
              - 'rust/mlt/**'
              - 'rust/mlt-core/**'

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: 'just' }

      # TypeScript
      - if: steps.filter.outputs.ts == 'true'
        uses: ./.github/actions/mlt-setup-node
      - name: Format TypeScript
        if: steps.filter.outputs.ts == 'true'
        run: just ts::fmt inspector::fmt

      # Rust
      # Also installs just and cargo-sort, so it has to come before the Rust fixups.
      - if: steps.filter.outputs.rust == 'true' || steps.filter.outputs.hexdumps == 'true' || steps.filter.outputs.expected == 'true'
        uses: ./.github/actions/mlt-setup-rust
      - name: Format Cargo.toml
        if: steps.filter.outputs.rust == 'true'
        run: just rust::fmt-toml

      - name: Sync package.json version from Cargo.toml
        if: steps.filter.outputs.wasm == 'true'
        run: just rust::sync-wasm-version

      - name: Sync pyproject.toml version from Cargo.toml
        if: steps.filter.outputs.py == 'true'
        run: just rust::sync-pyo3-version

      - name: Regenerate docs hexdump snippets from the synthetic fixtures
        if: steps.filter.outputs.hexdumps == 'true'
        run: just rust::sync-docs-hexdumps

      - name: Re-encode the real-world tiles in test/expected
        if: steps.filter.outputs.expected == 'true'
        run: just inspector::regenerate-expected

      - name: Setup Java for jextract
        if: steps.filter.outputs.ffi == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup jextract
        if: steps.filter.outputs.ffi == 'true'
        uses: ./.github/actions/mlt-setup-jextract

      - name: Install clang-format and ktlint
        if: steps.filter.outputs.ffi == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          curl -sSL https://github.com/pinterest/ktlint/releases/latest/download/ktlint -o /usr/local/bin/ktlint
          chmod +x /usr/local/bin/ktlint

      - name: Regenerate diplomat FFI bindings
        if: steps.filter.outputs.ffi == 'true'
        run: just rust::sync-ffi-bindings

      - name: Regenerate maplibre_tiles.pyi stub
        if: steps.filter.outputs.py == 'true'
        run: just rust::sync-pyo3-stubs

      # Pre-commit hooks, also the formatting tiebreaker for the generated files.
      # The second run fails only on what the hooks cannot fix.
      - name: Install uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: false }
      - name: Run pre-commit hooks
        if: ${{ !cancelled() }}
        run: uvx prek@0.5.5 run --all-files || uvx prek@0.5.5 run --all-files

      - if: ${{ !cancelled() }}
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: { commit-message: 'chore: apply automated fixes' }

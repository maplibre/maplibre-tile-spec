name: autofix.ci # See https://autofix.ci/security why this name; autofix.yml has the same one

# Commits the test output of every component when a pull request gets the `bless` label. Apart from autofix.yml, so
# that a label adds no skipped `Autofix` check to the pull request, which would satisfy that required check.
on:
  pull_request:
    types: [ labeled ]

permissions: { }

concurrency:
  group: ${{ github.workflow }}-bless-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bless:
    name: Bless test output
    runs-on: ubuntu-latest
    # Runs every component's tests; no successful run to measure, so generous
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event.label.name == 'bless'

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          mandb: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - name: Setup Rust
        run: rustup update stable && rustup default stable

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: 'just,cargo-binstall' }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - run: just bless
        continue-on-error: true

      # run the pre-commit hooks as a formatting tiebreaker
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx prek@0.5.5 run --all-files
        continue-on-error: true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with: { commit-message: 'chore: update blessed test snapshots across all components' }

name: C++ CI

on:
  workflow_call:
    inputs:
      run-heavy:
        description: Run the expensive artifact/fuzz jobs. Off for pull requests that are not on top of their stack.
        type: boolean
        default: true
  workflow_dispatch:

jobs:
  cpp-build:
    if: ${{ github.event_name != 'pull_request' || inputs.run-heavy }}
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      matrix:
        os: [ macos-15, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, fetch-depth: 1 }

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with: { tool: 'just,cargo-binstall' }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: 'cpp/.nvmrc' }

      - name: install gcovr (macOS)
        if: runner.os == 'macOS'
        run: brew install gcovr

      - name: install gcovr (Linux)
        if: runner.os == 'Linux'
        run: pip3 install gcovr

      - name: Build, test and generate coverage report
        run: just -v cpp::coverage

      - if: runner.os == 'Linux'
        uses: ./.github/actions/mlt-publish-coverage
        with:
          file: cpp/build/coverage.xml
          language: C++
          label: code-coverage/gcovr

      - name: Sanity test for mlt-cpp-json tool
        run: just -v cpp::test-json

      - name: Build with Bazel
        run: just -v cpp::bazel-build

      - run: just -v assert-git-is-clean

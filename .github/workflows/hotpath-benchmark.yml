name: hotpath benchmark

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "rust/**"
      - "hotpath/**"
      - ".github/workflows/hotpath-benchmark.yml"

permissions:
  contents: read

jobs:
  upload:
    name: hotpath benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the upload authenticates with the job's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mlt-setup-rust

      - name: Cache benchmark tiles
        id: cache-tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: '/tmp/benchmark-tiles', key: 'hotpath-tiles-protomaps-z6-v1' }

      - name: Download benchmark tiles
        if: steps.cache-tiles.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just rust::download-benchmark-tiles

      - name: Run benchmark and upload report
        working-directory: rust
        env:
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_BENCHMARK: mlt-convert
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,profile=release
          HOTPATH_OUTPUT_FORMAT: none
        run: |
          set -o pipefail
          cargo run -q --release -p mlt --features hotpath,hotpath-alloc,hotpath-cloud -- \
            convert /tmp/benchmark-tiles/ /tmp/mlt-out/ 2>&1 | tee run.log
          grep -q '^hotpath: uploaded report ' run.log

  report:
    name: hotpath benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/mlt-setup-rust

      - name: Cache benchmark tiles
        id: cache-tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: '/tmp/benchmark-tiles', key: 'hotpath-tiles-protomaps-z6-v1' }

      - name: Download benchmark tiles
        if: steps.cache-tiles.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just rust::download-benchmark-tiles

      - name: Run benchmark and write report
        working-directory: rust
        env:
          HOTPATH_BENCHMARK: mlt-convert
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,profile=release
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/report.json
        run: |
          cargo run -q --release -p mlt --features hotpath,hotpath-alloc,hotpath-cloud -- \
            convert /tmp/benchmark-tiles/ /tmp/mlt-out/
          test -s "$HOTPATH_OUTPUT_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotpath-report
          path: report.json
          retention-days: 1
          if-no-files-found: error

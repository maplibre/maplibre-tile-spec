name: hotpath relay

on:
  workflow_run:
    workflows: ["hotpath benchmark"]
    types: [completed]

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        benchmark: [mlt-convert, mlt-convert-v2, mlt-decode-v1, mlt-decode-v2]
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f8724d1e001c8a7f8ab805c26627a4fa0f9407f6 # v0.30.1
    permissions:
      actions: read # download the artifact of the benchmark run
      id-token: write # authenticate the upload
      pull-requests: read # find the pull request the run belongs to
    with:
      benchmark: ${{ matrix.benchmark }}
      artifact_name: hotpath-report
      report_file: ${{ matrix.benchmark }}.json

  size-diff:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifact of the benchmark run
      contents: read
      pull-requests: write # post the comment
    env:
      COMMENT_MARKER: '<!-- bench-comment:mlt-size-diff -->'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: 'just' }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v3.1.0-node20
        with:
          name: size-metrics
          path: /tmp/metrics/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compose comment
        run: |
          set -euo pipefail
          {
            echo "<details><summary>Per-tile encoded size diff</summary>"
            echo
            just rust::size-diff /tmp/metrics/base_sizes.db /tmp/metrics/head_sizes.db
            echo
            echo "</details>"
            echo
            echo "$COMMENT_MARKER"
          } > /tmp/comment.md

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(grep -E '^[0-9]+$' /tmp/metrics/pr_number.txt)
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@/tmp/comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@/tmp/comment.md
          fi

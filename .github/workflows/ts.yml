name: TypeScript CI

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with: { tool: 'just,cargo-binstall' }
      - uses: ./.github/actions/mlt-setup-node
      - name: Lint JS code. If fails, run `just ts::fmt` to reformat, and `just ts::lint` to see issues locally
        run: just -v ts::lint
      - run: just -v ts::test
      - run: just -v ts::build
      - name: Codecov upload
        if: "github.repository_owner == 'maplibre' && !cancelled()"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with: { files: 'ts/coverage/coverage-final.json' }
      - run: just -v assert-git-is-clean

<rect class="f1" x="0" y="112" width="200" height="28" rx="3"/>
<text class="cell" x="100.0" y="126">03 02 09 05 4d 00 00 00</text>
<text class="small mid" x="100.0" y="154">width 3, 2 exceptions</text>
<text class="small mid" x="100.0" y="168">max_width 9, at 5 and 77</text>

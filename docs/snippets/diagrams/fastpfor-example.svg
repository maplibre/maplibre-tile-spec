<text class="small mid" x="462.0" y="154">37 and 2</text>
<text class="small mid" x="462.0" y="168">6 bits each</text>
<text class="muted small mid" x="566.0" y="104">tail</text>
<rect class="f0" x="516" y="112" width="100" height="28" rx="3"/>

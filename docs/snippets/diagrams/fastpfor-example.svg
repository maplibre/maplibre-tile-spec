<svg class="mlt-diagram" viewBox="0 0 710 190" role="img" aria-label="The 21 words of the example in order: block_values 128, meta_offset 13, the 12 packed words of block 0 at width 3, meta_size 5, the metadata with 2 exceptions at positions 5 and 77, a bitmap with bit 5, an array count of 2, the packed exceptions 37 and 2, and the tail 5 and 200" xmlns="http://www.w3.org/2000/svg">

<svg class="mlt-diagram" viewBox="0 0 710 190" role="img" aria-label="A FastPFOR payload is a block_values word, pages and a tail. A page is a meta_offset, the packed blocks, meta_size, the block metadata, a bitmap and the exception arrays. The block metadata is a width and an exception count per block, then max_width and positions when there are exceptions" xmlns="http://www.w3.org/2000/svg">

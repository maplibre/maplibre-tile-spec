<rect class="f1" x="130" y="132" width="170" height="28" rx="3"/>
<text class="cell small" x="215" y="146">VarInt pairs</text>
<path class="link" d="M300 146.0H310"/>
<rect class="f1" x="310" y="132" width="90" height="28" rx="3"/>
<text class="cell" x="355" y="146">expand</text>

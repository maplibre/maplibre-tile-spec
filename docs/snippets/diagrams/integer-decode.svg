<svg class="mlt-diagram" viewBox="0 0 710 236" role="img" aria-label="How each integer logical encoding decodes: the physical step turns the payload into words, RLE and DeltaRLE read VarInt pairs and expand the runs, ZigZag is undone always under the delta encodings and only on signed streams otherwise, and the delta encodings end in one or two prefix sums. BitPacked unpacks the bits in place of the physical step" xmlns="http://www.w3.org/2000/svg">

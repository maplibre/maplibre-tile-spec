    <script>
    (() => {
      let pinned = null;
      try {
        if (window.parent !== window)
          pinned = window.parent.document.body.dataset.mdColorScheme ?? null;
      } catch {}
      document.documentElement.dataset.theme =
        pinned === null
          ? matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : pinned === "slate"
            ? "dark"
            : "light";
    })();
    </script>

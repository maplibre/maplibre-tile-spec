[package]
name = "mlt-wasm"
description = "WebAssembly bindings for the MapLibre Tile (MLT) format"
version = "0.1.29"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib"]

[features]
# Export the recorded LLVM coverage counters, for `just rust::wasm-coverage`
coverage = ["dep:minicov"]

[dependencies]
js-sys.workspace = true
minicov = { workspace = true, optional = true }
mlt-core = { workspace = true, features = ["unstable-v2"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

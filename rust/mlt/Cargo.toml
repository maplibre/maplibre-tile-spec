[package]
name = "mlt"
description = "MapLibre Tile Tools"
version = "0.7.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/rust-{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[features]
hotpath = ["hotpath/hotpath", "hotpath/tokio", "hotpath/threads", "hotpath/tui"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp", "hotpath/hotpath-mcp-meta"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
crossterm.workspace = true
earcut.workspace = true
flate2.workspace = true
futures.workspace = true
geo.workspace = true
geojson.workspace = true
glob.workspace = true
globset.workspace = true
hilbert_2d.workspace = true
hotpath.workspace = true
indicatif.workspace = true
martin-tile-utils.workspace = true
mbtiles.workspace = true
meshopt.workspace = true
mimalloc.workspace = true
mlt-core = { workspace = true, features = ["unstable-v2"] }
moka.workspace = true
pmtiles.workspace = true
proj4rs.workspace = true
quick-xml.workspace = true
ratatui.workspace = true
rayon.workspace = true
rstar.workspace = true
serde.workspace = true
serde_json.workspace = true
size_format.workspace = true
sqlx.workspace = true
tabled.workspace = true
thousands.workspace = true
tilejson.workspace = true
tokio.workspace = true
toml.workspace = true
union-find.workspace = true
usize_cast.workspace = true
walkdir.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
insta.workspace = true
test_each_file.workspace = true

[lints]
workspace = true
